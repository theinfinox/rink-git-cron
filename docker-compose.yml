version: '3.8'

services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: rink-sync-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8300:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    volumes:
      - rink-public-data:/app/public
      - rink-internal-data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cron-worker:
    build:
      context: .
      dockerfile: Dockerfile.cron
    container_name: rink-sync-cron
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - rink-public-data:/app/public
      - rink-internal-data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  rink-public-data:
  rink-internal-data:
