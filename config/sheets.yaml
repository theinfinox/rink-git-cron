frontendBaseUrl: https://rink-inst.vercel.app
sheets:
  - name: instrument
    spreadsheetId: 1DMW9DfaLEMvNoL29Yvj7HR4e1SIGpn_QXvEhPdI4U8k
    tabs:
      - name: Main Data
        gid: 5695880
        excludeRowsWhere:
          - column: id
            equals: id
        splitColumns:
          - column: tag
            delimiter: ','
        imageColumns: image_link
        excludeColumns:
          - tag
          - test
          - warnings
          - warnings_gemini
      - name: Instituitiion list
        gid: 1583764603
        aiSearch:
          enabled: false
        imageColumns:
          - logo_link
      - name: mou
        gid: 1204232309
    filterTaxonomy:
      - id: standardized_district
        title: Districts
        gid: 5695880
        groups:
          South Zone:
            - Thiruvananthapuram
            - Kollam
            - Pathanamthitta
          Central Zone:
            - Ernakulam
            - Thrissur
            - Alappuzha
            - Kottayam
            - Idukki
          North-Central Zone:
            - Palakkad
            - Malappuram
          North Zone:
            - Kozhikode
            - Kannur
            - Wayanad
            - Kasaragod
      - id: correct_provider_key
        title: Institution Type
        gid: 5695880
        linkType: join
        joinSource:
          gid: 1583764603
          foreignKey: correct_provider_key
          groupByColumn: reason_classification
          displayColumn: institution_name
          groupByDelimiter: ','
          autoDiscover: true
        groups: {}
  - name: rink_tech
    spreadsheetId: 1HXlzT504-AhqzfU6Nm3bktAspIjaQm2l1z45qROZrFc
    tabs:
      - name: technologies
        gid: 0
        excludeRowsWhere:
          - column: technology_id
            equals: technology_id
        splitColumns:
          - column: keywords
            delimiter: ','
        imageColumns: image_url
      - name: institutions
        gid: 1979443544
        imageColumns: institution_logo_url
  - name: services
    spreadsheetId: 1E9Pk8ZvWxlVju4H-rJ9KtbrbWKwuSZnreDhuezXbnoE
    tabs:
      - name: main_services
        gid: 0
        hierarchical_rows: true
        excludeColumns:
          - added_time
          - ip_address
        excludeRowsWhere:
          - column: approved
            equals: 'No'
          - column: column_12
            equals: Service Name
          - column: approved
            equals: ''
        autoGenerateId:
          enabled: true
          field: id
          prefix: service
          start: 100001
  - name: RINK_instrumentation_portal_form
    spreadsheetId: 1yECxIL-BGmUiIIfLFeZWVT1Ot_qxaeE4clITiIugHE8
    tabs:
      - name: Sheet1
        gid: 0
        hierarchical_rows: true
        excludeColumns:
          - ksum_uid
        imageColumns:
          - column_14
