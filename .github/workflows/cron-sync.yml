name: Nightly RINK Data Sync

on:
  schedule:
    # Runs automatically at 00:00 UTC (5:30 AM IST) every day
    - cron: '0 0 * * *'
  workflow_dispatch: 
    # Adds a manual "Run workflow" button in the GitHub Actions tab

jobs:
  sync-database:
    runs-on: ubuntu-latest
    permissions:
      contents: write # CRITICAL: Allows the bot to commit files back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install

      - name: Run Data Sync Script
        run: node scripts/sync.js

      - name: Run Image Downloader Script
        run: node scripts/downloadImages.js

      - name: Commit and Push Changes
        run: |
          # Dynamically pulls the repo owner's username for the commit
          git config --global user.name "${GITHUB_REPOSITORY_OWNER} Automated Pipeline"
          git config --global user.email "${GITHUB_REPOSITORY_OWNER}@users.noreply.github.com"
          
          # Stage the directories
          git add data/ public/
          
          # UNSTAGE redundant backup files to prevent repository bloat.
          # Restore both index and worktree to avoid unstaged changes before rebase.
          git restore --staged --worktree -- data/backups/ ':(glob)public/**/*.bak' ':(glob)data/**/*.bak' || true
          
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated Data & Image Sync: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          
          # Pull any new commits that were pushed while the action was running to prevent rejection
          git pull origin main --rebase
          git push origin main