name: Nightly RINK Data Sync

on:
  schedule:
    # Runs automatically at 00:00 UTC (5:30 AM IST) every day
    - cron: '0 0 * * *'
  workflow_dispatch: 
    # Adds a manual "Run workflow" button in the GitHub Actions tab

jobs:
  sync-database:
    runs-on: ubuntu-latest
    permissions:
      contents: write # CRITICAL: Allows the bot to commit files back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        working-directory: ./scripts
        run: npm install

      # ... earlier steps (like setting up Node.js) ...

      - name: Run Data Sync Script
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SHEET_GID: "5695880"
        run: node scripts/sync.js

      # ADD THIS NEW STEP RIGHT AFTER SYNC.JS
      - name: Run Image Downloader Script
        run: node scripts/downloadImages.js

      # UPDATE THIS EXISTING STEP TO INCLUDE THE PUBLIC FOLDER
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage BOTH the data directory AND the public directory
          git add data/ public/
          
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated Data & Image Sync: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          git push origin main
